[mgr]
sort_by = "natural"
sort_dir_first = true
show_symlink = true
scrolloff = 8

[preview]
tab_size = 4

[open]
append_rules = [
    { mime = "application/epub+zip", use = "ebook" }
]

[opener]
play = [
    { run = 'vlc "$@"', orphan = true }
]
ebook = [
    { run = 'ebook-viewer "$@"', orphan = true },
    { run = 'flatpak --cmd="ebook-vewier" com.calibre_ebook_calibre "$@"', orphan = true }
]

[plugin]
prepend_fetchers = [
    { group = "git", url = "*", run = "git" },
    { group = "git", url = "*/", run = "git" }
]
prepend_previewers = [
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
    { url = "*.markdown", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
    { mime = "application/epub+zip", run = "epub-preview" },
    { mime = "application/*zip", run = "ouch" },
    { mime = "application/x-tar", run = "ouch" },
    { mime = "application/x-bzip2", run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar", run = "ouch" },
    { mime = "application/x-xz", run = "ouch" },
    { mime = "application/xz", run = "ouch" }
]
