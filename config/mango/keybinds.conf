keymode=common
bind=SUPER+SHIFT, f5, reload_config
bind=CTRL+ALT, delete, quit

bind=SUPER, n, switch_layout

# window management
keymode=default
bind=SUPER, w, killclient

bind=ALT, tab, focuslast
bind=SUPER, tab, focusstack, next
bind=SUPER+SHIFT, tab, togglejump
bind=SUPER+SHIFT, o, toggleoverlay
bind=SUPER, g, togglefloating
bind=SUPER, a, toggleoverview
bind=SUPER, f, togglefullscreen
bind=NONE, f11, togglefullscreen

bind=SUPER, o, dwindle_toggle_split_direction

bind=SUPER, h, focusdir, left
bind=SUPER, j, focusdir, down
bind=SUPER, k, focusdir, up
bind=SUPER, l, focusdir, right

bind=SUPER+SHIFT, h, exchange_client, left
bind=SUPER+SHIFT, j, exchange_client, down
bind=SUPER+SHIFT, k, exchange_client, up
bind=SUPER+SHIFT, l, exchange_client, right

bind=SUPER+ALT, h, resizewin, -50, +0
bind=SUPER+ALT, j, resizewin, +0, +50
bind=SUPER+ALT, k, resizewin, +0, -50
bind=SUPER+ALT, l, resizewin, +50, +0
bind=SUPER+ALT+SHIFT, h, resizewin, -1, +0
bind=SUPER+ALT+SHIFT, j, resizewin, +0, +1
bind=SUPER+ALT+SHIFT, k, resizewin, +0, -1
bind=SUPER+ALT+SHIFT, l, resizewin, +1, +0

# resize mode
bind=SUPER, r, setkeymode, resize
keymode=resize
bind=NONE, h, resizewin, -50, +0
bind=NONE, j, resizewin, +0, +50
bind=NONE, k, resizewin, +0, -50
bind=NONE, l, resizewin, +50, +0
bind=NONE, h, resizewin, -1, +0
bind=NONE, j, resizewin, +0, +1
bind=NONE, k, resizewin, +0, -1
bind=NONE, l, resizewin, +1, +0
bind=NONE, ESCAPE, setkeymode, default

# function keys
keymode=common
bind=NONE, XF86MonBrightnessUp, spawn, brightnessctl s +5%
bind=NONE, XF86MonBrightnessDown, spawn, brightnessctl s 5%-
bind=SHIFT, XF86MonBrightnessUp, spawn, brightnessctl s +1%
bind=SHIFT, XF86MonBrightnessDown, spawn, brightnessctl s 1%-
bind=NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 5%-
bind=SHIFT, XF86AudioRaiseVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 1%+
bind=SHIFT, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_SINK@ 1%-
bind=NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE, XF86AudioNext, spawn, playerctl next
bind=NONE, XF86AudioPrev, spawn, playerctl previous
bind=NONE, XF86AudioPlay, spawn, playerctl play-pause

# workspaces
keymode=common
bind=SUPER, 1, view, 1, 0
bind=SUPER, 2, view, 2, 0
bind=SUPER, 3, view, 3, 0
bind=SUPER, 4, view, 4, 0
bind=SUPER, 5, view, 5, 0
bind=SUPER, 6, view, 6, 0
bind=SUPER, 7, view, 7, 0
bind=SUPER, 8, view, 8, 0
bind=SUPER, 9, view, 9, 0

# move to workspace
bind=SUPER+SHIFT, 1, tag, 1, 0
bind=SUPER+SHIFT, 2, tag, 2, 0
bind=SUPER+SHIFT, 3, tag, 3, 0
bind=SUPER+SHIFT, 4, tag, 4, 0
bind=SUPER+SHIFT, 5, tag, 5, 0
bind=SUPER+SHIFT, 6, tag, 6, 0
bind=SUPER+SHIFT, 7, tag, 7, 0
bind=SUPER+SHIFT, 8, tag, 8, 0
bind=SUPER+SHIFT, 9, tag, 9, 0

# mouse and trackpad bind
mousebind=SUPER, btn_left, moveresize, curmove
mousebind=SUPER, btn_right, moveresize, curresize
mousebind=SUPER+CTRL, btn_left, minimized

gesturebind=NONE, left, 3, focusdir, left
gesturebind=NONE, right, 3, focusdir, right
gesturebind=NONE, up, 3, focusdir, up
gesturebind=NONE, down, 3, focusdir, down

gesturebind=NONE, left, 4, viewtoleft_have_client
gesturebind=NONE, right, 4, viewtoright_have_client
gesturebind=NONE, up, 4, toggleoverview
gesturebind=NONE, down, 4, toggleoverview

# launchers
keymode=default
# bind=SUPER, d, spawn, rofi -show run

# applications
keymode=default
bind=SUPER, t, spawn, alacritty
bind=SUPER, RETURN, spawn, alacritty
bind=SUPER+SHIFT, RETURN, spawn, wezterm

bind=SUPER, b, spawn, firefox
bind=SUPER, e, spawn, cosmic-files
bind=SUPER+SHIFT, b, spawn, firefox --private-window
bind=SUPER+SHIFT, c, spawn, flatpak run io.github.Qalculate
bind=NONE, f1, spawn, false # disables f1 annoying help menu
